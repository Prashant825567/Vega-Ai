services:
  - type: web
    name: vega-max-v1-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_NAME
        value: Max v1.0
      - key: APP_NAME
        value: Vega
      - key: DEFAULT_MODEL
        value: mimo-v2.6-flash-free
      - key: GEMINI_VOICE_MODEL
        value: gemini-3.1-flash-live-preview
      - key: GEMINI_STT_MODEL
        value: gemini-3.1-flash-live-preview
      - key: GEMINI_TTS_MODEL
        value: gemini-3.1-flash-live-preview
      - key: GEMINI_TTS_VOICE
        value: Aoede
      - key: OPENCODE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ZENTRAGRID_BASE_URL
        value: https://vega-storage.onrender.com
      - key: ZENTRAGRID_API_KEY
        sync: false
      - key: IMAGE_API_URL
        value: https://image-api.pr3095079.workers.dev
      - key: IMAGE_API_KEY
        sync: false
